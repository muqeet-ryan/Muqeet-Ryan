<svg width="700" height="140" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal window background -->
  <rect x="0" y="0" width="700" height="140" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="34" rx="14" fill="#161b22"/>
  <rect x="0" y="20" width="700" height="14" fill="#161b22"/>
  <circle cx="25" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="75" cy="17" r="6" fill="#27c93f"/>
  <text x="350" y="22" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="13" fill="#8b949e">muqeet@portfolio: ~</text>

  <!-- Typing text area -->
  <clipPath id="clip1">
    <rect x="185" y="65" width="0" height="45">
      <animate attributeName="width"
        values="0;330;330;0;0"
        keyTimes="0;0.2;0.35;0.45;1"
        dur="10s"
        repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <clipPath id="clip2">
    <rect x="235" y="65" width="0" height="45">
      <animate attributeName="width"
        values="0;0;230;230;0;0"
        keyTimes="0;0.5;0.65;0.8;0.9;1"
        dur="10s"
        repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <text x="185" y="97" clip-path="url(#clip1)"
        font-family="Fira Code, Consolas, Monaco, monospace" font-size="30" font-weight="700" fill="#7ee787">Hello World 🌍💻▌</text>

  <text x="235" y="97" clip-path="url(#clip2)"
        font-family="Fira Code, Consolas, Monaco, monospace" font-size="30" font-weight="700" fill="#e6edf3">MUQEET RYAN▌</text>
</svg>
